name: CleftPath CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend-test:
    name: Backend Tests & Quality
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: cleftpath_admin
          POSTGRES_PASSWORD: devpassword123
          POSTGRES_DB: cleftpath_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Backend Pytest Suite
        env:
          DATABASE_URL: postgresql+asyncpg://cleftpath_admin:devpassword123@localhost:5432/cleftpath_db
          JWT_SECRET: ci_test_jwt_secret_key_32_bytes_long_here
          ENVIRONMENT: test
          DEBUG: "false"
          GEMINI_API_KEY: ""
        run: |
          cd backend
          pytest -v

  frontend-test:
    name: Frontend Tests, Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: |
          cd frontend
          npm ci

      - name: TypeScript Typecheck
        run: |
          cd frontend
          npm run typecheck

      - name: Run Frontend Vitest Suite
        run: |
          cd frontend
          npm run test -- --run

      - name: Production Vite Build
        run: |
          cd frontend
          npm run build

  deploy-preview-or-manual:
    name: Production Deployment Preparation (Manual Gate)
    needs: [backend-test, frontend-test]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    steps:
      - name: Deployment Gate Notice
        run: |
          echo "All automated tests, typechecks, and builds have PASSED."
          echo "To execute production deployment, configure the target cloud provider (e.g. Google Cloud Run / AWS ECS) using encrypted GitHub repository secrets."
